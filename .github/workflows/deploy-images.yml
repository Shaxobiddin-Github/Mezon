name: Deploy images

# v1: the cloud server is deployed from deploy/Dockerfile. This proves on every relevant PR that both
# images build (cloud API runtime and the HTTPS entry with the admin cabinet) and that the API
# container starts, migrates and answers /health/ready against a real PostgreSQL.
on:
  push:
    branches:
      - main
    paths:
      - 'deploy/**'
      - 'apps/cloud/**'
      - 'apps/admin/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - '.dockerignore'
  pull_request:
    branches:
      - main
    paths:
      - 'deploy/**'
      - 'apps/cloud/**'
      - 'apps/admin/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - '.dockerignore'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-smoke:
    name: Build deploy images and smoke-test the API
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build cloud runtime image
        run: docker build -f deploy/Dockerfile --target runner -t guzar-cloud:ci .

      - name: Build web (Caddy + admin cabinet) image
        run: docker build -f deploy/Dockerfile --target web -t guzar-web:ci .

      - name: Admin cabinet is inside the web image, with its stylesheet
        # Pilot 11-21: the cabinet shipped without CSS (Tailwind was never wired in) and rendered as
        # plain HTML. The page must link a stylesheet that contains the utilities it uses.
        run: |
          docker run --rm guzar-web:ci test -f /srv/admin/index.html
          docker run --rm guzar-web:ci sh -c 'grep -q "rel=\"stylesheet\"" /srv/admin/index.html && grep -l "bg-slate-50" /srv/admin/assets/*.css'

      - name: Start the stack and check /health/ready
        working-directory: deploy
        env:
          MEZON_POSTGRES_ADMIN_PASSWORD: ci-admin-password-1234567890
          MEZON_APP_DB_PASSWORD: ci-app-password-1234567890
          JWT_SECRET: ci-jwt-secret-at-least-32-characters-long
          CLOUD_DOMAIN: localhost
          ACME_EMAIL: ci@example.invalid
        run: |
          if ! docker compose up -d postgres migrate cloud; then
            docker compose logs postgres migrate cloud
            docker compose down -v
            exit 1
          fi
          for i in $(seq 1 60); do
            if docker compose exec -T cloud wget -q -O - http://127.0.0.1:4000/health/ready | grep -q '"ok"'; then
              echo "cloud ready"; docker compose down -v; exit 0
            fi
            sleep 2
          done
          docker compose logs migrate cloud
          docker compose down -v
          exit 1

      - name: Backup, restore on a fresh server, and the API still starts
        working-directory: deploy
        env:
          MEZON_POSTGRES_ADMIN_PASSWORD: ci-admin-password-1234567890
          MEZON_APP_DB_PASSWORD: ci-app-password-1234567890
          JWT_SECRET: ci-jwt-secret-at-least-32-characters-long
          CLOUD_DOMAIN: localhost
          ACME_EMAIL: ci@example.invalid
        run: |
          set -eu
          fail() { docker compose logs postgres migrate cloud || true; docker compose down -v; exit 1; }
          # Migrated database -> dump with the compose backup service (deploy/BACKUP-RESTORE.md).
          docker compose up -d --wait postgres || fail
          docker compose run --rm migrate || fail
          docker compose run --rm backup || fail
          dump=$(basename "$(ls backups/*.dump | head -n1)")
          tables_before=$(docker compose exec -T postgres psql -U mezon_admin -d mezon_cloud -tAc "select count(*) from pg_tables where schemaname='public'")
          policies_before=$(docker compose exec -T postgres psql -U mezon_admin -d mezon_cloud -tAc "select count(*) from pg_policies")
          # A new server: empty volume, roles from init-db, then restore.
          docker compose down -v
          docker compose up -d --wait postgres || fail
          docker compose run --rm --entrypoint /bin/sh backup /scripts/restore-pg.sh "/backups/$dump" || fail
          tables_after=$(docker compose exec -T postgres psql -U mezon_admin -d mezon_cloud -tAc "select count(*) from pg_tables where schemaname='public'")
          policies_after=$(docker compose exec -T postgres psql -U mezon_admin -d mezon_cloud -tAc "select count(*) from pg_policies")
          echo "tables $tables_before -> $tables_after, policies $policies_before -> $policies_after"
          [ "$tables_before" = "$tables_after" ] && [ "$policies_before" = "$policies_after" ] && [ "$tables_after" -gt 0 ] || fail
          # The restored database is current: migrate is a no-op and the API answers.
          docker compose up -d migrate cloud || fail
          for i in $(seq 1 60); do
            if docker compose exec -T cloud wget -q -O - http://127.0.0.1:4000/health/ready | grep -q '"ok"'; then
              echo "cloud ready on the restored database"; docker compose down -v; exit 0
            fi
            sleep 2
          done
          fail

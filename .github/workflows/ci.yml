name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - '.mezon/**'
      - '**/*.md'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '.mezon/**'
      - '**/*.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    name: Detect Desktop Changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      desktop: ${{ steps.filter.outputs.desktop }}
    steps:
      - id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.url }}
        run: |
          node -e '
            const fs = require("node:fs");
            (async () => {
              let page = 1;
              let desktopChanged = false;
              while (true) {
                const res = await fetch(`${process.env.PR_URL}/files?per_page=100&page=${page}`, {
                  headers: {
                    Authorization: `Bearer ${process.env.GH_TOKEN}`,
                    Accept: "application/vnd.github+json",
                    "X-GitHub-Api-Version": "2022-11-28",
                  },
                });
                if (!res.ok) throw new Error(`GitHub API ${res.status}`);
                const files = await res.json();
                if (
                  files.some(
                    (f) =>
                      f.filename.startsWith("apps/desktop/") ||
                      f.filename.startsWith("packages/drivers/"),
                  )
                ) {
                  desktopChanged = true;
                  break;
                }
                if (files.length < 100) break;
                page += 1;
              }
              fs.appendFileSync(process.env.GITHUB_OUTPUT, `desktop=${desktopChanged}\n`);
            })().catch((e) => {
              console.error(e);
              process.exit(1);
            });
          '

  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.18.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run verify (format, build, lint, typecheck, db:check, test, depcruise)
        run: pnpm verify

  postgres-rls:
    name: Verify PostgreSQL RLS (ubuntu-latest)
    runs-on: ubuntu-latest
    env:
      MEZON_REQUIRE_PG: '1'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.18.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm run build

      - name: Run PostgreSQL RLS and bigint integration tests
        run: pnpm exec vitest run packages/db-cloud

  desktop:
    name: Build & E2E Desktop Installer (windows-latest)
    needs: [detect-changes]
    if: |
      !cancelled() && (
        (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'pull_request' && needs.detect-changes.result == 'success' && needs.detect-changes.outputs.desktop == 'true')
      )
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.18.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Stage & build Windows NSIS installer
        run: pnpm --filter @mezon/desktop run pack:win

      - name: Verify Electron 45 native ABI (better-sqlite3, argon2, koffi)
        run: pnpm --filter @mezon/desktop run verify:abi

      - name: Verify fused packaged binary (fuses, RunAsNode/--inspect block, smoke launch, T5)
        run: pnpm --filter @mezon/desktop run verify:fuses

      - name: Run Playwright _electron E2E on identical app.asar
        run: pnpm --filter @mezon/desktop run test:e2e

      - name: Upload Windows NSIS installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: mezon-desktop-win-x64-nsis
          path: apps/desktop/dist-electron/Mezon-Setup-*.exe
          if-no-files-found: error
          retention-days: 14

services:
  postgres:
    image: postgres:18-alpine
    container_name: mezon-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mezon_cloud}
      POSTGRES_USER: ${POSTGRES_USER:-mezon_admin}
      POSTGRES_PASSWORD: ${MEZON_POSTGRES_ADMIN_PASSWORD}
      MEZON_APP_DB_PASSWORD: ${MEZON_APP_DB_PASSWORD}
    volumes:
      # PostgreSQL 18 images keep data in /var/lib/postgresql/18/docker and refuse to start with a
      # volume on the old /var/lib/postgresql/data path: mount the parent directory.
      - mezon_pgdata:/var/lib/postgresql
      - ./init-db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        # -h 127.0.0.1: the first-start init server listens on the socket only, so the check stays
        # unhealthy until the real server is up (otherwise migrate can hit the init restart).
        [
          'CMD-SHELL',
          'pg_isready -h 127.0.0.1 -U ${POSTGRES_USER:-mezon_admin} -d ${POSTGRES_DB:-mezon_cloud}',
        ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - mezon_internal

  migrate:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: runner
    container_name: mezon-cloud-migrate
    restart: 'no'
    command: ['pnpm', '--filter', '@mezon/cloud', 'db:migrate']
    environment:
      DATABASE_ADMIN_URL: postgres://${POSTGRES_USER:-mezon_admin}:${MEZON_POSTGRES_ADMIN_PASSWORD}@postgres:5432/${POSTGRES_DB:-mezon_cloud}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - mezon_internal

  cloud:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: runner
    container_name: mezon-cloud-api
    restart: unless-stopped
    environment:
      PORT: 4000
      HOST: 0.0.0.0
      DATABASE_URL: postgres://mezon_app:${MEZON_APP_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-mezon_cloud}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://${CLOUD_DOMAIN}}
      NODE_ENV: production
      # Telegram (optional: leave TELEGRAM_BOT_TOKEN empty to keep the bot off)
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - mezon_internal

  caddy:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: web
    container_name: mezon-caddy
    restart: unless-stopped
    environment:
      CLOUD_DOMAIN: ${CLOUD_DOMAIN:?CLOUD_DOMAIN is required}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL is required}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - mezon_caddy_data:/data
      - mezon_caddy_config:/config
    depends_on:
      - cloud
    networks:
      - mezon_internal

  # Daily backup and restore (deploy/BACKUP-RESTORE.md). A one-off container from the same
  # PostgreSQL image; it never runs with `up`, only with `docker compose run --rm backup`.
  backup:
    image: postgres:18-alpine
    profiles: ['tools']
    restart: 'no'
    entrypoint: ['/bin/sh', '/scripts/backup-pg.sh']
    environment:
      MEZON_POSTGRES_ADMIN_PASSWORD: ${MEZON_POSTGRES_ADMIN_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER:-mezon_admin}
      POSTGRES_DB: ${POSTGRES_DB:-mezon_cloud}
      # 13 = the last 14 daily copies (find -mtime +13).
      RETENTION_DAYS: ${MEZON_BACKUP_RETENTION_DAYS:-13}
    volumes:
      - ./scripts:/scripts:ro
      - ${MEZON_BACKUP_DIR:-./backups}:/backups
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - mezon_internal

volumes:
  mezon_pgdata:
  mezon_caddy_data:
  mezon_caddy_config:

networks:
  mezon_internal:
    driver: bridge
